name: Compiler Image Laser (Windows)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Installer les dépendances
        run: npm install

      - name: Créer l'installateur .exe
        run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Mettre le .exe à disposition
        uses: actions/upload-artifact@v4
        with:
          name: Image-Laser-Windows
          path: dist/*.exe
